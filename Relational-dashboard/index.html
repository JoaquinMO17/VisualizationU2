<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Network Analysis Dashboard</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components/hero-network.css">
    <link rel="stylesheet" href="assets/css/components/metric-cards.css">
    <link rel="stylesheet" href="assets/css/components/radial-comparison.css">
    <link rel="stylesheet" href="assets/css/components/distribution-area.css">
    <link rel="stylesheet" href="assets/css/components/community-circles.css">
    <link rel="stylesheet" href="assets/css/components/influence-flow.css">
    <link rel="stylesheet" href="assets/css/components/node-ranking.css">
    <link rel="stylesheet" href="assets/css/components/insights-panel.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div>
                    <h1 class="header-title">Facebook Network Analysis</h1>
                    <p class="header-subtitle">Social Network Structure and Centrality Metrics</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            
            <!-- Hero Network Visualization -->
            <section class="section">
                <div id="hero-network" class="hero-network"></div>
            </section>

            <!-- Metric Cards -->
            <section class="section">
                <div id="metric-cards" class="metric-cards-container grid grid-4"></div>
            </section>

            <!-- Radial Comparison & Community Circles -->
            <section class="section">
                <div class="grid grid-2">
                    <div class="card">
                        <h3 class="card-title">Centrality Comparison</h3>
                        <div id="radial-comparison"></div>
                    </div>
                    <div class="card">
                        <h3 class="card-title">Community Structure</h3>
                        <div id="community-circles"></div>
                    </div>
                </div>
            </section>

            <!-- Distribution Area -->
            <section class="section">
                <div class="card">
                    <h3 class="card-title">Clustering Coefficient Distribution</h3>
                    <div id="distribution-area"></div>
                </div>
            </section>

            <!-- Node Ranking & Influence Flow -->
            <section class="section">
                <div class="grid grid-2">
                    <div class="card">
                        <h3 class="card-title">Top Nodes Ranking</h3>
                        <div id="node-ranking"></div>
                    </div>
                    <div class="card">
                        <h3 class="card-title">Influence Flow</h3>
                        <div id="influence-flow"></div>
                    </div>
                </div>
            </section>

            <!-- Insights Panel -->
            <section class="section">
                <div id="insights-panel" class="insights-container"></div>
            </section>

        </div>
    </main>

    <!-- D3.js Library -->
    <script src="libs/d3.v7.min.js"></script>
    
    <!-- Application Scripts -->
    <script type="module" src="assets/js/config/theme.js"></script>
    <script type="module" src="assets/js/config/chartDefaults.js"></script>
    <script type="module" src="assets/js/data/dataManager.js"></script>
    <script type="module" src="assets/js/utils/formatters.js"></script>
    <script type="module" src="assets/js/utils/scales.js"></script>
    <script type="module" src="assets/js/interactions/tooltips.js"></script>
    <script type="module" src="assets/js/visualizations/heroNetwork.js"></script>
    <script type="module" src="assets/js/visualizations/metricCards.js"></script>
    <script type="module" src="assets/js/visualizations/radialComparison.js"></script>
    <script type="module" src="assets/js/visualizations/smoothDistribution.js"></script>
    <script type="module" src="assets/js/visualizations/communityCircles.js"></script>
    <script type="module" src="assets/js/visualizations/influenceFlow.js"></script>
    <script type="module" src="assets/js/visualizations/nodeRanking.js"></script>
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
